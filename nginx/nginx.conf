# Nginx: sirve el frontend estático y publica la API de FastAPI en el mismo origen.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # API REST -> backend FastAPI (Gunicorn/Uvicorn)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentación interactiva (Swagger / OpenAPI)
    location /docs        { proxy_pass http://backend:8000/docs; }
    location /redoc       { proxy_pass http://backend:8000/redoc; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    # SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
